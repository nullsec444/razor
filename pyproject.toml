[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razor-stealth"
version = "0.1.0"
description = "Zero-cost, production-grade anti-detect and protocol-fidelity framework for AI agents, scrapers, and browser automation."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "RAZOR Core Contributors" }]
keywords = ["anti-detect", "stealth", "tls-fingerprint", "ja4", "camoufox", "curl-cffi", "web-automation", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
browser = [
    "camoufox[geoip]>=0.4.0",
    "playwright>=1.40.0",
]
full = [
    "razor-stealth[browser]",
    "pytest>=8.0.0",
]

[project.scripts]
razor = "stealth_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stealth_core*"]
